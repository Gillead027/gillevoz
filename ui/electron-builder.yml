# Empacota a interface do GilleVoz para o instalador (instalador/montar.ps1).
# Só Windows, alvo `dir`: a pasta dist/win-unpacked vira a pasta app\ da instalação (Inno Setup).
appId: br.gillezin.gillevoz
productName: GilleVoz
directories:
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!test/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,mts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraFiles:
  - from: AVISOS-DE-TERCEIROS.md
    to: AVISOS-DE-TERCEIROS.md
asarUnpack:
  - resources/**
win:
  target: dir
  executableName: GilleVoz
  icon: ../instalador/icone.ico
npmRebuild: false
publish: null
